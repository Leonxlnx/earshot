[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "earshot"
version = "1.0.0"
description = "Make sound effects for interfaces, motion videos, games and films, everyday foley, drums and ambience from a request in words (computed at request time; the realistic ones from models learned from public-domain recordings, no audio shipped), build what the catalogue lacks from recorded parts named in words, and describe, match, measure and critique sound an agent cannot hear."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Leon Lin" }]
keywords = ["audio", "sound", "ai-agents", "mcp", "claude-code", "clap", "audio-analysis", "sound-design",
            "sound-effects", "procedural-audio", "synthesis", "game-audio", "ui-sounds", "audio-sprite", "video",
            "cpu"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
  "Topic :: Games/Entertainment",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# the base install makes sounds (make, make_set, sounds, the bank, kits, pack: CLI, Python and MCP tools); listening,
# measuring files and pictures come with the extras below (earshot.extras says which call needs which)
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "soxr>=0.3",          # resampling: a sound written at another rate than 48 kHz, files read at another rate
  "numba>=0.58",        # the hot loops of the synthesis; without it they run in plain Python
]

[project.urls]
Homepage = "https://github.com/Leonxlnx/earshot"
Repository = "https://github.com/Leonxlnx/earshot"
Issues = "https://github.com/Leonxlnx/earshot/issues"

[project.optional-dependencies]
# the listening models (CLAP, the AudioSet tagger) and librosa: describe, match, rank, find, compare, ab, realness,
# timeline, critique, profile, vocab, make with listen. CPU wheels of torch:
# pip install torch --index-url https://download.pytorch.org/whl/cpu
listen = ["torch>=2.6", "transformers>=4.40", "librosa>=0.10"]
measure = ["librosa>=0.10"]                         # measure, find and profile's onsets, without the models
images = ["matplotlib>=3.8", "pillow>=10"]          # sheet, gallery, video frames, plots
mcp = ["mcp>=2"]
llm = ["requests>=2.31"]
all = ["earshot[listen,measure,images,mcp,llm]"]
dev = ["pytest>=8"]

[project.scripts]
earshot = "earshot.cli:main"

[tool.setuptools.packages.find]
include = ["earshot*"]

[tool.setuptools.package-data]
earshot = ["data/*.json", "data/*.npz", "data/recipes/*.json", "data/resyn/*.npz", "data/resyn/*.json", "data/resyn/*.md", "data/textures/*.npz", "data/textures/*.json", "data/textures/*.md", "data/drums/*.npz", "data/drums/*.json", "data/drums/*.md", "data/notes/*.json", "data/notes/*.md", "data/notes/*/*.npz", "forge/bank/*.json", "forge/kits/*.json", "forge/seeds/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# uv (`uv tool install`) takes torch from the CPU-only wheel index; pip ignores this
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
